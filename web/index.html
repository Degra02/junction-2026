<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>The4thLover</title>
    <meta
      name="description"
      content="Check any post, meme, or article: how it persuades, who else reported it, what was copied, and how sure we are, with every source shown."
    />
    <meta name="theme-color" content="#f8f8f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090a" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode).
      try {
        var t = localStorage.getItem("junction-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
