[project]
name = "propaganda-eval"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "scikit-learn>=1.7",
    "pandas>=2.3",
    "tabulate>=0.9",
    "openai>=1.82",
]

[project.scripts]
propaganda-eval = "propaganda_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
