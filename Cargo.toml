[workspace]
resolver = "3"
members = ["api", "contracts"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
junction-contracts = { path = "contracts" }
anyhow = "1"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
governor = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json", "chrono", "uuid"] }
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "6.0.0", features = ["chrono", "uuid", "preserve_order"] }
utoipa-axum = "0.3.0"
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
strip = true
lto = "thin"
