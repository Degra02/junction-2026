# The compose stack publishes only Caddy's ports. Same here: the API accepts traffic only from
# Caddy (it trusts X-Forwarded-For), the worker only from the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-caddy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: caddy
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-from-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - port: 8001
