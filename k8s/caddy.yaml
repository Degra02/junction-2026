# The caddy image (deploy/caddy.Dockerfile): the web/ build at /, /api/* proxied to the `api`
# Service (the Caddyfile's default API_UPSTREAM). Plain HTTP on :80 for a local cluster: reach it
# with `kubectl -n junction port-forward svc/caddy 8088:80`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy
    spec:
      containers:
        - name: caddy
          image: ghcr.io/degra02/junction-2026-caddy
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: SITE_ADDRESS
              value: ":80"
          volumeMounts:
            # No certificates without a hostname; the volumes only give Caddy writable state.
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  selector:
    app.kubernetes.io/name: caddy
  ports:
    - name: http
      port: 80
      targetPort: http
