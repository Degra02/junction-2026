# Production stack on the VPS. Files next to it: Caddyfile, .env (secrets, from the team vault)
# and release.env (IMAGE_TAG, written by the deploy workflow).
#   docker compose --env-file .env --env-file release.env up -d
# Local smoke test with locally built images: see `mise run deploy:local`.
name: junction

services:
  caddy:
    image: docker.io/library/caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${IMAGE_REPO:-ghcr.io/degra02/junction-2026}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No `ports:`: reachable only through Caddy, so X-Forwarded-For can be trusted.
    environment:
      WORKER_URL: http://worker:8001
      TRUST_PROXY: "true"
      PIPELINE_VERSION: ${IMAGE_TAG:-latest}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      STAGE_TIMEOUT_SECS: ${STAGE_TIMEOUT_SECS:-120}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "junction-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      worker:
        condition: service_started

  worker:
    image: ${IMAGE_REPO:-ghcr.io/degra02/junction-2026}-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # 2 vCPU: one inference at a time, using both cores.
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - hf-cache:/models
    # An OOM kills the worker (restarted; the API marks the step failed), not the API or Caddy.
    mem_limit: ${WORKER_MEM_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  caddy-data:
  caddy-config:
  api-data:
  hf-cache:
