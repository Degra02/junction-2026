# Production stack on the VPS. Files next to it: .env (secrets, from the team vault) and
# release.env (IMAGE_TAG, written by the deploy workflow).
#   docker compose --env-file .env --env-file release.env up -d
name: junction

services:
  caddy:
    # Caddy with deploy/Caddyfile and the web/ build baked in (deploy/caddy.Dockerfile).
    image: ${IMAGE_REPO:-ghcr.io/degra02/junction-2026}-caddy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      # Certificates and the ACME account: without it every restart re-issues the certificates.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ${IMAGE_REPO:-ghcr.io/degra02/junction-2026}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # No `ports:`: reachable only through Caddy, so X-Forwarded-For can be trusted.
    environment:
      WORKER_URL: http://worker:8001
      TRUST_PROXY: "true"
      PIPELINE_VERSION: ${IMAGE_TAG:-latest}
      # Stage calls wait this long for a worker that is still loading its models after a deploy.
      WORKER_CONNECT_WAIT_SECS: ${WORKER_CONNECT_WAIT_SECS:-180}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      MAX_ANALYSES_PER_HOUR: ${MAX_ANALYSES_PER_HOUR:-600}
      STAGE_TIMEOUT_SECS: ${STAGE_TIMEOUT_SECS:-120}
      ANALYSIS_TIMEOUT_SECS: ${ANALYSIS_TIMEOUT_SECS:-300}
      MAX_CONCURRENT_ANALYSES: ${MAX_CONCURRENT_ANALYSES:-4}
      MAX_CONCURRENT_INFERENCE: ${MAX_CONCURRENT_INFERENCE:-1}
      # Kill switch: comma-separated stages to skip, e.g. STAGES_DISABLED=explain in .env.
      STAGES_DISABLED: ${STAGES_DISABLED:-}
      # Copies of the database in the api-data volume (backups/, newest four kept).
      BACKUP_INTERVAL_MINS: ${BACKUP_INTERVAL_MINS:-15}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "junction-api", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      worker:
        condition: service_started

  worker:
    image: ${IMAGE_REPO:-ghcr.io/degra02/junction-2026}-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # 2 vCPU: one inference at a time (the API's MAX_CONCURRENT_INFERENCE), using both cores.
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - hf-cache:/models
    # An OOM kills the worker (restarted; the API marks the step failed), not the API or Caddy.
    mem_limit: ${WORKER_MEM_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  caddy-data:
  caddy-config:
  api-data:
  hf-cache:
