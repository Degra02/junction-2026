name: deploy

# PRs: build the three images (no push) so a broken Dockerfile, web build or Caddyfile fails
# before merge.
# main: build, push to GHCR as sha-<short> and latest, then deploy to the VPS over SSH.
# Deploy runs only when the repo variable DEPLOY_HOST is set. Required configuration:
#   vars:    DEPLOY_HOST (e.g. srv123456.hstgr.cloud), DEPLOY_USER (default root),
#            DEPLOY_DIR (default /opt/junction)
#   secrets: DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS (`ssh-keyscan <host>` output)
# The VPS keeps its own .env (secrets) in DEPLOY_DIR and is logged in to ghcr.io.
# The caddy image carries the Caddyfile and the web/ build, so one IMAGE_TAG pins UI, proxy and
# backend together.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "api/**"
      - "contracts/**"
      - "worker/**"
      - "pipeline/**"
      - "deploy/**"
      - "web/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, worker, caddy]
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      repo: ${{ steps.vars.outputs.repo }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: |
          echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.vars.outputs.repo }}-${{ matrix.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.repo }}-${{ matrix.image }}:latest
          # Separate scopes, or the two images evict each other's cache.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      USER_AT_HOST: ${{ vars.DEPLOY_USER || 'root' }}@${{ vars.DEPLOY_HOST }}
      DIR: ${{ vars.DEPLOY_DIR || '/opt/junction' }}
      TAG: ${{ needs.images.outputs.tag }}
      REPO: ${{ needs.images.outputs.repo }}
    steps:
      - uses: actions/checkout@v7
      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
      - name: Copy compose file
        run: scp -i ~/.ssh/id_deploy deploy/compose.yaml "$USER_AT_HOST:$DIR/"
      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/id_deploy "$USER_AT_HOST" "set -e; cd '$DIR'; touch .env
            printf 'IMAGE_TAG=%s\nIMAGE_REPO=%s\n' '$TAG' '$REPO' > release.env
            docker compose --env-file .env --env-file release.env pull
            docker compose --env-file .env --env-file release.env up -d --remove-orphans
            docker image prune -f"
      - name: Smoke check
        # Healthy means the API answers, the worker is up (it listens only once its models are
        # loaded) and no stage failed to import: a deploy that breaks the pipeline goes red.
        run: |
          for i in $(seq 1 72); do
            health=$(curl -fsS "https://$HOST/api/health" || true)
            if jq -e '.worker != null and all(.worker.stages[]; .error == null)' <<<"$health" >/dev/null; then
              echo "$health"
              exit 0
            fi
            sleep 5
          done
          echo "not healthy after 6 minutes; last answer: $health" >&2
          exit 1
