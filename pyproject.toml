[project]
name = "junction-2026"
version = "0.1.0"
description = "Python side of the pipeline: the stage worker (worker/) and the pipeline stages (pipeline/)"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.162.7",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.96.0",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
# Not an installable package: run from the repo root (`python -m worker`), which puts
# `worker` and `pipeline` on the import path.
package = false

[tool.pytest.ini_options]
testpaths = ["worker/tests", "pipeline"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["pipeline/common/contracts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
