[project]
name = "junction-2026"
version = "0.1.0"
description = "Python side of the pipeline: the stage worker (worker/) and the pipeline stages (pipeline/)"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fastapi>=0.162.7",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "torch>=2.15.0",
    "transformers>=5.23.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.96.0",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
# Not an installable package: run from the repo root (`python -m worker`), which puts
# `worker` and `pipeline` on the import path.
package = false

# The VPS has no GPU (D13). The default PyPI torch wheel bundles CUDA libraries (several GB in
# the worker image); `uv add torch` resolves to the CPU build through this index.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["worker/tests", "pipeline"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["pipeline/common/contracts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Typographic quotes, dashes and non-Latin letters are data here (any-language content, D2).
ignore = ["RUF001", "RUF002", "RUF003"]
