[tools]
node = "26.13.0"
python = "3.14.10"
bun = "1.4.4"
uv = "0.13.7"
gitleaks = "8.30.1"

[env]
# Load secrets from the git-ignored .env (copy .env.example).
_.file = ".env"

[tasks.setup]
description = "Install pinned tools and enable the repo git hooks"
run = ["mise install", "git config core.hooksPath .githooks"]

[tasks.secrets]
description = "Scan the full git history for leaked secrets"
run = "gitleaks git --redact --no-banner ."

[tasks.check]
description = "Everything CI runs; extend with lint/typecheck/tests once the stack exists"
depends = ["secrets"]
